<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>trabajopractico.json</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  </head>
  <body>
      <div id="map" style="height: 500px; width: 500px;"></div>
      <select id="lista">
        <option value="">Selecciona un lugar...</option>
      </select>
      <p id="descripcion">Selecciona un lugar para ver su descripción.</p>
      <div id="Imagen">
        <img src="https://via.placeholder.com/600x400?text=Selecciona+un+lugar" style="width:400px; background-size:cover; background-position:center;" alt="Imagen del lugar">
      </div>
      
  </body>
  
  <script>
    const iconoPersonalizado = L.icon({
      iconUrl: 'hospital.png', // ruta o URL de tu imagen
      iconSize: [40, 40],      // tamaño del ícono
      iconAnchor: [20, 40],    // punto del ícono que se alinea a la coordenada
      popupAnchor: [0, -40],   // posición del popup relativo al ícono
    });
    const lista = document.getElementById('lista');
    const descripcion = document.getElementById('descripcion');
    const info = document.getElementById('info');
    const imagenDiv = document.getElementById("Imagen");
    const imagenTag = imagenDiv.querySelector("img");
    const marcadores = [];

    // Crear el mapa centrado en una ubicación (por ejemplo Buenos Aires)
    const map = L.map('map').setView([-34.5230973, -58.7053485], 13);

    // Agregar capa de OpenStreetMap

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/">OpenStreetMap</a> contributors'
    }).addTo(map);

      const puntos = [
      {
        coords: [-34.5230973, -58.7053485],
        nombre: "Universidad Nacional De General Sarmiento",
        descripcion:
          "La UNGS es una universidad pública destacada por su compromiso social y su entorno natural amplio, ideal para el estudio y la investigación.",
        imagen: "https://noticiasungs.ungs.edu.ar/wp-content/uploads/2020/03/Bienestar-D%C3%ADa-del-Estu_opt.jpeg"
      },
      {
        coords: [-34.530499, -58.7055509],
        nombre: "Terrazas de Mayo",
        descripcion:
          "Centro comercial moderno con tiendas, restaurantes, cine y espacios al aire libre, muy visitado los fines de semana.",
        imagen: "https://www.irsa.com.ar/wp-content/uploads/2024/12/Terrazas-de-mayo-5.jpeg"
      },
      {
        coords: [-34.5429576, -58.716732],
        nombre: "Plaza Sarmiento",
        descripcion:
          "Una de las plazas más conocidas de San Miguel, con áreas verdes, juegos para niños y eventos comunitarios frecuentes.",
        imagen: "https://www.smnoticias.com/wp-content/uploads/2023/02/Catedral-de-San-Miguel-desde-la-plaza-principal.jpeg"
      },
      {
        coords: [-34.5422524, -58.7126277],
        nombre: "Bingo San Miguel",
        descripcion:
          "Centro de entretenimiento con bingo, música en vivo y opciones gastronómicas, muy concurrido por locales y turistas.",
        imagen: "https://dynamic-media-cdn.tripadvisor.com/media/photo-o/0f/da/ae/ef/bingo-san-miguel.jpg?w=900&h=500&s=1"
      },
    ];

      

      puntos.forEach((p, i) => {
        const marker = L.marker(p.coords).addTo(map).bindPopup(p.nombre);
        marcadores.push(marker);

        const option = document.createElement("option");
        option.value = i;
        option.textContent = p.nombre;
        lista.appendChild(option);

        // Evento click en el marcador → sincroniza el select y la descripción
        marker.on("click", () => {
          map.setView(p.coords, 16, { animate: true });
          lista.value = i;
          descripcion.textContent = p.descripcion;
          imagenTag.src = p.imagen;
          imagenTag.alt = p.nombre;
        });
      });
      
      lista.addEventListener('change', (e) => {
      const i = e.target.value;
      if (i !== '') {
        const punto = puntos[i];
        map.setView(punto.coords, 16, { animate: true });
        marcadores[i].openPopup();
        descripcion.textContent = punto.descripcion;
        imagenTag.src = punto.imagen;
        imagenTag.alt = punto.nombre;
      } else {
        descripcion.textContent = 'Selecciona un lugar para ver su ubicación.';
        imagenTag.src = "https://via.placeholder.com/600x400?text=Selecciona+un+lugar";
        imagenTag.alt = "Imagen del lugar";
      }
    });


  </script>
</html>
